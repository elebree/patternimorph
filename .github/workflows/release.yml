name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1) to publish that version to nuget.org
# and GitHub Packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to GitHub Packages
  id-token: write   # NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not v<semver>." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: dotnet build Patternimorph.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - run: dotnet test Patternimorph.sln -c Release --no-build

      - run: dotnet pack Patternimorph/Patternimorph.csproj -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # GitHub Packages has no symbol server, so the .snupkg only goes to nuget.org.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
          --no-symbols

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "$GITHUB_REF_NAME"
          --generate-notes
          ${{ contains(steps.version.outputs.version, '-') && '--prerelease' || '' }}
